version: "2"

# golangci-lint v2 (CI pins the exact version: .github/workflows/ci.yml).
# Linters are listed explicitly rather than taken from a preset, so a new
# golangci-lint release can't switch new ones on (or deprecated ones, like
# gomodguard in the "fast" preset) and fail CI without a code change.

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: none

  enable:
    # correctness
    - govet
    - staticcheck
    - errcheck
    - errorlint
    - ineffassign
    - unused
    - bodyclose
    - nilerr
    - noctx
    - copyloopvar
    # style and performance
    - gocritic
    - prealloc
    - unparam
    - unconvert
    - wastedassign
    - dogsled
    - dupword
    - misspell
    - usestdlibvars

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false

    govet:
      enable:
        - nilness
        - unusedresult
        - reflectvaluecompare

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - unnamedResult
        - hugeParam

    dupword:
      # "return nil, nil, err" is not a typo
      ignore:
        - nil

    misspell:
      locale: US

  exclusions:
    generated: lax
    presets:
      - std-error-handling

formatters:
  enable:
    - gofumpt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/linkvite/go
